name: <+service.name>
replicas: 2
# Harness can't list GHCR tags anonymously, so the image is set here instead of as a service artifact
image: ghcr.io/scarolan/captain-canary:stable
version: stable
namespace: <+infra.namespace>
serviceType: ClusterIP
servicePort: 80
containerPort: 8080
ingressSubDomain: <+variable.sandbox_id>
