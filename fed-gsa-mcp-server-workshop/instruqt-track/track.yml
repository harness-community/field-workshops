  ![](https://raw.githubusercontent.com/harness-community/field-workshops/harness-se/assets/images/harness_white-logo.png)

  **You built an MCP server. Now ship it safely.**

  In this lab you will:
  - **Lab 1:** Find and fix a vulnerable dependency, then gate the release on an agent evaluation that checks accuracy and expert caveats
  - **Lab 2:** Add a policy gate so nothing reaches production without approval

  The build and deployment challenges are optional during the live session. Click Skip and we will set them up for you. Your lab stays open afterward so you can come back and explore.
