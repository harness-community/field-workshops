# Harness fills in the <+...> expressions at deploy time.
name: showcase
replicas: 3

# The image Harness picked from the service's artifact source (your HAR registry),
# and the credentials to pull it
image: <+artifacts.primary.image>
dockercfg: <+artifacts.primary.imagePullSecret>
build: <+artifacts.primary.tag>

environment: <+env.identifier>

servicePort: 80
# The Your App tab in Instruqt opens this port on your sandbox VM
nodePort: 30080
containerPort: 8080
