apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.name }}
spec:
  ingressClassName: nginx
  rules:
  - host: {{ lower .Values.ingressHost | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.name }}
            port:
              number: {{ int .Values.servicePort }}
  tls:
  - hosts:
    - {{ lower .Values.ingressHost | quote }}
