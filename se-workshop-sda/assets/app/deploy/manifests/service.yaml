apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  labels:
    app: {{ .Values.name }}
spec:
  type: NodePort
  ports:
  - name: http
    port: {{ int .Values.servicePort }}
    targetPort: http
    nodePort: {{ int .Values.nodePort }}
    protocol: TCP
  # Matches stable and canary pods alike, so a canary takes a share of live traffic
  selector:
    app: {{ .Values.name }}
