{{- if .Values.dockercfg }}
# Pull credentials for the Harness Artifact Registry, filled in by Harness from the
# service's artifact source. skip-versioning keeps one stable name across releases.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.name }}-pull
  annotations:
    harness.io/skip-versioning: "true"
type: kubernetes.io/dockercfg
data:
  .dockercfg: {{ .Values.dockercfg }}
{{- end }}
