apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  labels:
    app: {{ .Values.name }}
spec:
  replicas: {{ int .Values.replicas }}
  # harness.io/track: stable is here from the first (rolling) deploy because a canary adds it
  # to the stable Deployment's selector, and a selector can't change once the Deployment exists.
  # Without it, switching from rolling to canary in Lab 4 fails with "field is immutable".
  selector:
    matchLabels:
      app: {{ .Values.name }}
      harness.io/track: stable
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
        harness.io/track: stable
    spec:
      {{- if .Values.dockercfg }}
      imagePullSecrets:
      - name: {{ .Values.name }}-pull
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: {{ .Values.name }}
        image: {{ .Values.image }}
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: {{ int .Values.containerPort }}
        env:
        - name: PORT
          value: {{ .Values.containerPort | quote }}
        - name: DEPLOY_ENV
          value: {{ .Values.environment | quote }}
        - name: BUILD
          value: {{ .Values.build | quote }}
        # Probes use /ready, never /health. A release with `healthy: false` still starts and
        # takes traffic, so the pipeline's smoke test (which calls /health) is what catches it
        # and triggers the rollback, in seconds rather than after a rollout timeout.
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 1
          periodSeconds: 3
        livenessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 20m
            memory: 16Mi
          limits:
            memory: 64Mi
