title: 'Harness Software Delivery Agent: ハンズオンワークショップ（日本語版）'
teaser: アプリをブランディングし、Harness Software Delivery Agent にビルド、デプロイ、カナリアデプロイ、ガバナンスを任せます。
description: |2-

  ![](https://raw.githubusercontent.com/harness-community/field-workshops/harness-se/assets/images/harness_white-logo.png)

  このワークショップでは、実際のアプリを Kubernetes にリリースします。構築作業を担うのは Harness Software Delivery Agent です。やりたいことを自然な言葉で伝え、エージェントの提案を確認して承認します。

    - 自分のアプリをブランディング: リアルタイムのトレーディングデスク用ティッカー、または LED 電光掲示板
    - エージェントに CI を構築させる: テスト、ビルド、Harness Artifact Registry へのプッシュ
    - AI で失敗したビルドの原因を突き止めて修正
    - エージェントにサービス、環境、デプロイを作成させる
    - カナリアデプロイに切り替え、問題のあるリリースが自動でロールバックされる様子を確認
    - ガバナンスポリシーに引っかかったパイプラインを、エージェントに準拠させる
